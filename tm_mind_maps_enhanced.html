<script>
// Tab switching function
function show(id, el) {
  const sections = document.querySelectorAll('.sec');
  const tabs = document.querySelectorAll('.tab');
  
  sections.forEach(s => {
    if (s.classList.contains('active')) {
      s.style.opacity = '0';
      s.style.transform = 'translateY(-10px)';
    }
  });
  
  setTimeout(() => {
    sections.forEach(s => s.classList.remove('active'));
    tabs.forEach(t => t.classList.remove('active'));
    
    const activeSection = document.getElementById(id);
    if (activeSection) {
      activeSection.classList.add('active');
      activeSection.style.opacity = '1';
      activeSection.style.transform = 'translateY(0)';
    }
    
    if (el) {
      el.classList.add('active');
    }
  }, 150);
}

// Back to top button
function setupBackToTop() {
  const backToTopBtn = document.createElement('button');
  backToTopBtn.className = 'back-to-top';
  backToTopBtn.innerHTML = '↑';
  backToTopBtn.title = 'Back to top';
  document.body.appendChild(backToTopBtn);
  
  window.addEventListener('scroll', () => {
    if (window.pageYOffset > 300) {
      backToTopBtn.classList.add('show');
    } else {
      backToTopBtn.classList.remove('show');
    }
  });
  
  backToTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

// Initialize
window.addEventListener('load', () => {
  const activeSection = document.querySelector('.sec.active');
  if (activeSection) {
    activeSection.style.opacity = '1';
    activeSection.style.transform = 'translateY(0)';
    activeSection.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
  }
  
  document.querySelectorAll('.sec').forEach(s => {
    s.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
  });
  
  setupBackToTop();
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  const tabs = Array.from(document.querySelectorAll('.tab'));
  const activeTab = document.querySelector('.tab.active');
  const activeIndex = tabs.indexOf(activeTab);
  
  if (e.key === 'ArrowRight' && activeIndex < tabs.length - 1) {
    tabs[activeIndex + 1].click();
  } else if (e.key === 'ArrowLeft' && activeIndex > 0) {
    tabs[activeIndex - 1].click();
  }
});
</script>

  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --glass-bg: rgba(255, 255, 255, 0.92);

  --text-main: #1f2937;
  --text-muted: #6b7280;
  --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  --map-bg: #ffffff;
  --node-text: #1f2937;
  --search-bg: #ffffff;
  --btn-bg: #ffffff;
  --btn-border: #e5e7eb;
  --tab-bg: #f3f4f6;
  --tab-text: #4b5563;
}

body.dark-mode {
  --glass-bg: rgba(17, 24, 39, 0.92);
  --glass-border: rgba(255, 255, 255, 0.08);
  --text-main: #f9fafb;
  --text-muted: #9ca3af;
  --primary: #818cf8;
  --primary-hover: #6366f1;
  --map-bg: #111827;
  --node-text: #f3f4f6;
  --search-bg: #1f2937;
  --btn-bg: #1f2937;
  --btn-border: #374151;
  --tab-bg: #1f2937;
  --tab-text: #9ca3af;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-gradient);
  min-height: 100vh;
  padding: 1.5rem 1rem;
  transition: all 0.4s ease;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 24px;
  box-shadow: var(--card-shadow);
  border: 1px solid var(--glass-border);
  min-height: 92vh;
  display: flex;
  flex-direction: column;
  transition: background 0.4s ease;
}

.header {
  text-align: center;
  margin-bottom: 1.25rem;
}

.header h1 {
  font-size: 2.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.03em;
  margin-bottom: 0.25rem;
}

.header p {
  color: var(--text-muted);
  font-size: 0.95rem;
  font-weight: 500;
}

.nav-links {

  gap: 0.75rem;
  justify-content: center;
  margin-bottom: 1.25rem;
}

.nav-links a {

  background: var(--primary);
  color: white;
  text-decoration: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 0.9rem;

  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
}

.nav-links a:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
  background: var(--primary-hover);
}

.controls-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  gap: 0.75rem;

}

.search-container {

.search-input {

.search-icon {

.action-buttons {

.btn-icon {

  border: 1px solid var(--btn-border);

.btn-icon:hover {

}

.tabs {

}

.tab {

  border-radius: 10px;
  background: var(--tab-bg);
  color: var(--tab-text);

.tab:hover { background: var(--btn-border); }

.tab.active {

#mindmap-container {

  min-height: 550px;

#mindmap-svg {

@media (max-width: 768px) {

// ── Color Palette ──
const branchColors = ['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#14b8a6'];

// ── State ──
let currentTopic = 's1';
let zoomBehavior, svgGroup, svgEl;

// ── Render Mind Map ──
function renderMindMap(topicId) {
  currentTopic = topicId;
  const container = document.getElementById('mindmap-container');
  const w = container.clientWidth;
  const h = container.clientHeight;

  // Clear
  d3.select('#mindmap-svg').selectAll('*').remove();

  const data = mindmapData[topicId];
  const root = d3.hierarchy(data);

  // Tree layout - horizontal (46px vertical gap prevents text overlap)
  const totalNodes = root.descendants().length;
  const vGap = totalNodes > 20 ? 40 : 46;
  const hGap = 240;
  const treeLayout = d3.tree().nodeSize([vGap, hGap]);
  treeLayout(root);

  svgEl = d3.select('#mindmap-svg')
    .attr('width', w)
    .attr('height', h);

  // Zoom behavior
  zoomBehavior = d3.zoom()
    .scaleExtent([0.3, 3])
    .on('zoom', (event) => {
      svgGroup.attr('transform', event.transform);
    });

  svgEl.call(zoomBehavior);

  svgGroup = svgEl.append('g');

  // Assign branch colors based on top-level index
  root.children && root.children.forEach((child, i) => {
    const color = branchColors[i % branchColors.length];
    child._branchColor = color;
    child.descendants().forEach(d => { d._branchColor = color; });
  });
  root._branchColor = branchColors[0];

  // Draw links
  svgGroup.selectAll('.link')
    .data(root.links())
    .enter()
    .append('path')
    .attr('class', 'link')
    .attr('d', d3.linkHorizontal()
      .x(d => d.y)
      .y(d => d.x)
    )
    .attr('stroke', d => d.target._branchColor || '#94a3b8')
    .attr('stroke-width', d => Math.max(1.5, 4 - d.target.depth));

  // Draw nodes
  const node = svgGroup.selectAll('.node')
    .data(root.descendants())
    .enter()
    .append('g')
    .attr('class', 'node')
    .attr('transform', d => `translate(${d.y},${d.x})`)
    .style('cursor', d => d.data.link ? 'pointer' : 'default')
    .on('click', (event, d) => {
      if (d.data.link) {
        window.location.href = d.data.link;
      }
    })
    .on('mouseenter', (event, d) => {
      if (d.data.link) {
        const tooltip = document.getElementById('tooltip');
        tooltip.textContent = '📖 Click to view notes';
        tooltip.style.opacity = '1';
        tooltip.style.left = (event.offsetX + 15) + 'px';
        tooltip.style.top = (event.offsetY - 10) + 'px';
      }
    })
    .on('mouseleave', () => {
      document.getElementById('tooltip').style.opacity = '0';
    });

  // Node circles
  node.append('circle')
    .attr('r', d => d.depth === 0 ? 8 : d.children ? 5 : 3.5)
    .attr('fill', d => d.depth === 0 ? branchColors[0] : d._branchColor || '#94a3b8')
    .attr('stroke', d => d.depth === 0 ? '#4f46e5' : d._branchColor || '#94a3b8')
    .attr('stroke-opacity', 0.6);

  // Node labels
  node.append('text')
    .attr('dy', '0.35em')
    .attr('x', d => d.children ? -12 : 10)
    .attr('text-anchor', d => d.children ? 'end' : 'start')
    .attr('font-weight', d => d.depth <= 1 ? '700' : '500')
    .attr('font-size', d => d.depth === 0 ? '15px' : d.depth === 1 ? '13px' : '12px')
    .attr('fill', d => d.data.link ? (d._branchColor || 'var(--primary)') : 'var(--node-text)')
    .text(d => d.data.link ? d.data.name + ' →' : d.data.name);

  // Center the map
  fitView();
}

// ── Fit / Center View ──
function fitView() {
  const container = document.getElementById('mindmap-container');
  const w = container.clientWidth;
  const h = container.clientHeight;

  const bounds = svgGroup.node().getBBox();
  const fullWidth = bounds.width;
  const fullHeight = bounds.height;
  const midX = bounds.x + fullWidth / 2;
  const midY = bounds.y + fullHeight / 2;

  const scale = Math.min(
    0.85 * w / fullWidth,
    0.85 * h / fullHeight,
    1.5
  );

  const translate = [w / 2 - midX * scale, h / 2 - midY * scale];

  svgEl.transition().duration(600)
    .call(zoomBehavior.transform, d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale));
}

// ── Tab Handling ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderMindMap(tab.getAttribute('data-topic'));
    document.getElementById('search-input').value = '';
  });
});

// ── Zoom Controls ──
document.getElementById('zoom-in').onclick = () => {
  svgEl.transition().duration(300).call(zoomBehavior.scaleBy, 1.3);
};
document.getElementById('zoom-out').onclick = () => {
  svgEl.transition().duration(300).call(zoomBehavior.scaleBy, 0.75);
};
document.getElementById('fit-view').onclick = () => fitView();

// ── Download SVG ──
document.getElementById('download-svg').onclick = () => {
  const svgData = document.querySelector('#mindmap-svg').outerHTML;
  const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mindmap_' + currentTopic + '.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// ── Dark Mode ──
document.getElementById('dark-mode-toggle').onclick = () => {
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
  // Re-render to update node text colors
  renderMindMap(currentTopic);
};

// ── Search ──
document.getElementById('search-input').addEventListener('input', (e) => {
  const term = e.target.value.toLowerCase().trim();
  const nodes = d3.selectAll('.node');

  if (!term) {
    nodes.classed('search-highlight', false).classed('search-dim', false);
    return;
  }

  nodes.each(function(d) {
    const match = d.data.name.toLowerCase().includes(term);
    d3.select(this).classed('search-highlight', match).classed('search-dim', !match);
  });
});

// ── Back to Top ──
const backToTopBtn = document.createElement('button');
backToTopBtn.className = 'back-to-top';
backToTopBtn.innerHTML = '↑';
document.body.appendChild(backToTopBtn);

window.addEventListener('scroll', () => {
  backToTopBtn.classList.toggle('show', window.pageYOffset > 300);
});
backToTopBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

// ── Resize Handler ──

window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const container = document.getElementById('mindmap-container');
    d3.select('#mindmap-svg')
      .attr('width', container.clientWidth)
      .attr('height', container.clientHeight);
    fitView();
  }, 200);
});

// ── Initialize ──
window.addEventListener('load', () => {
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark-mode');
  }
  renderMindMap('s1');
});
</script>
